<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         <table class="darkTable">
        <thead>
        <tr>
          <th>Speaker</th>
          <th>Title</th>
          <th>Location</th>
          <th>Year</th>
        </tr>
        </thead>
        <tbody>
          <tr>
            <td>Presisdent and Sister Meredith</td>
            <td>Remeber The Identifiers</td>
            <td>Rexburg, ID</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Elder James O. Fantone</td>
            <td>The Battle is the Lord's</td>
            <td>Rexburg, ID</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Rob Garrett</td>
            <td>He Will Make More of You</td>
            <td>Rexburg, ID</td>
            <td>2026</td>
          </tr>
        </tbody>
        </table>
        <div id="enter-info">
          <h4>Add a New Devotional</h4>
          <form action="favdevo.html" method="post">
            <label for="speaker">Speaker:</label>
            <input type="text" id="speaker" name="speaker" required>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" required>
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" required>
            <input type="submit" value="Submit">
          </form>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
