<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body {
            background-color: #E8ECED;
            font-family: Arial;
        }
        .card {
            background: url("images/christus.webp");
            border:7px solid black;
            width: 777px;
            height: 600px;
            margin: 0 auto;
            border-radius: 20px;
            background-size: cover;
            background-position-x: -178px;
            text-align: center;
            color: white;
        }
        .pres{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .counselor {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
        }
        a {
            border: 4px solid white;
            border-radius: 50%;
            width: auto;
            height: auto;
            margin: 5px;
            margin-top: 10px;
            display: inline-flex;
        }
        a:hover{
            border: 4px solid #110950;
        }
        #apostles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 380px;
            margin:0 auto;
        }
        #apostles h2 {
            flex: 0 0 100%;
        }
        #apostles a img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0;
            object-fit: cover;
        }
        #apostles a {
            border: 4px solid white;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            margin: 5px;
        }
        #apostles a:hover {
            border: 4px solid #110950;
        }

    </style>
</head>
