<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        /* Daily Feed Top */

        #formContainer {
            width: 500px;
            margin: 40px auto;
            border-radius: 30px;
            border: solid 12px rgb(32, 7, 132);
            background: white;
        }

        #formTop {
            background-image: url('images/jesus_feeds_5000.jpeg');
            height: 200px;
            width: 100%;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            background-size: cover;
        }

        #formTop button {
            font-size: 1rem;
            border-radius: 5px;
            padding: 4px 8px;
            cursor: pointer;
            margin-left: 10px;
            margin-top: 10px;
        }

        #formTop h1 {
            color: white;
            text-align: center;
            padding-top: 20px;
            font-size: 2.5rem;
            text-shadow: 3px 2px 1px #000000;
            margin-top: 25px;
        }

        #formTop h2 {
            color: white;
            text-align: center;
            font-size: 2rem;
            text-shadow: 3px 2px 1px #000000;
            font-weight: normal;
        }

        /* Daily Feed Form */
        
        h3 {
            text-align: center;
            margin-top: 20px;
            font-size: 1.5rem;
        }

        form {
            padding: 20px; 
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(7, 1fr);
            grid-row-gap: 20px;
            font-size: 1.2rem;
        }

        form input[type="text"],
        form input[type="password"],
        form input[type="email"] {
            height: 20px;
            border-radius: 3px;
        }

        #subscribe {
            grid-column: 1 /  3;
            justify-self: center;
        }

        #conditions {
            grid-column: 1 /  3;
            justify-self: center;
        }

        #submitBtn {
            grid-column: 1 /  3;
            display: flex;
            justify-content: center;
            font-size: 1rem;
        }

        /* Scripture Images */
        
        #scriptureImg {
            display: flex;
            justify-content: space-between;
        }

        #scriptureImg img {
            width: 95px;
            height: 120px;
        }

        #OT {
            border-bottom-left-radius: 15px;
        }

        #PoGP {
            border-bottom-right-radius: 15px;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <div id="formTop">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section id="subscribe">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section id="conditions">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section id="submitBtn">
                <button type="submit">Submit</button>
            </section>

            
        </form>
        <section id="scriptureImg">
            <img id="OT" src="images/old_testament.webp" alt="Old Testament">
            <img id="NT" src="images/new_testament.webp" alt="New Testament">
            <img id="BoM" src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img id="DnC" src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img id="PoGP" src="images/pearl_of_great_price.webp" alt="Pearl of Great Price ">

        </section>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
